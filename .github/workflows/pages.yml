name: pages

# The public page. It is assembled from site/ and the root's data files on every
# change to main, and published only when the vault guard is green — the same
# guard that holds the page to the withheld vocabulary in both of its languages.
#
# One switch lives outside this file and outside the agent's reach:
# Settings → Pages → Source: "GitHub Actions". Until it is on, the deploy step
# fails with "Get Pages site failed" and nothing is published.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: assemble the page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: The QR code's library, pinned
        run: pip install segno==1.6.6

      - name: The vault guard — nothing is published past a red one
        run: python3 scripts/check_vault.py

      - name: Web-sized images
        run: pip install pillow==12.0.0

      - name: Assemble _site/
        run: python3 scripts/build_site.py

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
