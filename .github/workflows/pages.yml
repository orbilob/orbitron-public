name: pages

# The public page. It is assembled from site/ and the root's data files on every
# change to main, and published only when the vault guard is green — the same
# guard that holds the page to the withheld vocabulary in both of its languages.
#
# One switch lives outside this file and outside the agent's reach:
# Settings → Pages → Source: "GitHub Actions". Until it is on, the deploy step
# fails with "Get Pages site failed" and nothing is published.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: assemble the page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: The QR code's library, pinned
        run: pip install segno==1.6.6

      - name: The vault guard — nothing is published past a red one
        run: python3 scripts/check_vault.py

      - name: Web-sized images
        run: pip install pillow==12.0.0

      - name: Assemble _site/
        run: python3 scripts/build_site.py

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
