name: vault

# This vault argues, in "05 — HOW WE WORK", that documentation is kept honest
# by a guard rather than by good intentions. This is that guard, applied to
# the vault itself — otherwise the argument is advertising.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# The guard only reads. Its token is held to that here, in the file, rather than
# left to the repository's default — so a fooled step can change nothing.
permissions:
  contents: read

jobs:
  guard:
    name: the vault guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: The QR code's library, pinned
        run: pip install segno==1.6.6

      - name: Links, wiki links, callouts, withheld words, board freshness
        run: python3 scripts/check_vault.py

      - name: The page assembles
        run: python3 scripts/build_site.py
