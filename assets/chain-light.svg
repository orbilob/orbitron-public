<svg xmlns="http://www.w3.org/2000/svg" width="880" height="254" viewBox="0 0 880 254" role="img" aria-label="The chain: ORPROBE then ORLAB then ORCORE. Then four stages: lost in space, found home, back to school, the proving ground.">
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}</style>
<g transform="translate(0,0)"><rect width="276" height="196" rx="10" fill="#eaeef3" stroke="#d8dee6"/><text x="16" y="34" font-size="14" font-weight="700" letter-spacing="0.06em" fill="#1a1f27">ORPROBE</text><text x="16" y="53" font-size="12" font-style="italic" fill="#f0b429">the sonde</text><line x1="16" y1="66" x2="260" y2="66" stroke="#d8dee6"/><text x="16" y="86" font-size="13.5" font-weight="600" fill="#1a1f27">The Sampler</text><text x="260" y="86" text-anchor="end" font-size="11" fill="#f0b429">Proxima Centauri b</text><text x="16" y="120" font-size="13.5" font-weight="600" fill="#1a1f27">The Sweep</text><text x="260" y="120" text-anchor="end" font-size="11" fill="#f0b429">TOI-700 d</text><text x="16" y="154" font-size="13.5" font-weight="600" fill="#1a1f27">The Store</text><text x="260" y="154" text-anchor="end" font-size="11" fill="#f0b429">Ross 128 b</text><text x="16" y="180" font-size="11.5" fill="#6b7686">brings the material</text></g><text x="289" y="104" text-anchor="middle" font-size="17" fill="#6b7686">&#9656;</text><g transform="translate(302,0)"><rect width="276" height="196" rx="10" fill="#eaeef3" stroke="#d8dee6"/><text x="16" y="34" font-size="14" font-weight="700" letter-spacing="0.06em" fill="#1a1f27">ORLAB</text><text x="16" y="53" font-size="12" font-style="italic" fill="#f0b429">the assay</text><line x1="16" y1="66" x2="260" y2="66" stroke="#d8dee6"/><text x="16" y="86" font-size="13.5" font-weight="600" fill="#1a1f27">The Inspection</text><text x="260" y="86" text-anchor="end" font-size="11" fill="#f0b429">Teegarden's Star b</text><text x="16" y="120" font-size="13.5" font-weight="600" fill="#1a1f27">The Cut</text><text x="260" y="120" text-anchor="end" font-size="11" fill="#f0b429">TRAPPIST-1e</text><text x="16" y="154" font-size="13.5" font-weight="600" fill="#1a1f27">The Verdict</text><text x="260" y="154" text-anchor="end" font-size="11" fill="#f0b429">K2-18b</text><text x="16" y="180" font-size="11.5" fill="#6b7686">says whether there is anything in it</text></g><text x="591" y="104" text-anchor="middle" font-size="17" fill="#6b7686">&#9656;</text><g transform="translate(604,0)"><rect width="276" height="196" rx="10" fill="#eaeef3" stroke="#d8dee6"/><text x="16" y="34" font-size="14" font-weight="700" letter-spacing="0.06em" fill="#1a1f27">ORCORE</text><text x="16" y="53" font-size="12" font-style="italic" fill="#f0b429">mission control</text><line x1="16" y1="66" x2="260" y2="66" stroke="#d8dee6"/><text x="16" y="86" font-size="13.5" font-weight="600" fill="#1a1f27">The Passport Desk</text><text x="260" y="86" text-anchor="end" font-size="11" fill="#f0b429">Kepler-22b</text><text x="16" y="120" font-size="13.5" font-weight="600" fill="#1a1f27">The Press</text><text x="260" y="120" text-anchor="end" font-size="11" fill="#f0b429">LHS 1140 b</text><text x="16" y="154" font-size="13.5" font-weight="600" fill="#1a1f27">The Harvest</text><text x="260" y="154" text-anchor="end" font-size="11" fill="#f0b429">Kepler-452b</text><text x="16" y="180" font-size="11.5" fill="#6b7686">gives the finding an identity</text></g>
<text x="0" y="218" font-size="10.5" letter-spacing="0.14em" fill="#6b7686">AND THEN FOUR STAGES</text>
<text x="110" y="236" text-anchor="middle" font-size="11.5" fill="#6b7686"><tspan fill="#f0b429">1</tspan>  lost in space</text><text x="330" y="236" text-anchor="middle" font-size="11.5" fill="#6b7686"><tspan fill="#f0b429">2</tspan>  found home</text><text x="550" y="236" text-anchor="middle" font-size="11.5" fill="#6b7686"><tspan fill="#f0b429">3</tspan>  back to school</text><text x="770" y="236" text-anchor="middle" font-size="11.5" fill="#6b7686"><tspan fill="#f0b429">4</tspan>  the proving ground</text>
</svg>
