re is anything in it</text></g><text x="591" y="104" text-anchor="middle" font-size="17" fill="#7c8899">&#9656;</text><g transform="translate(604,0)"><rect width="276" height="196" rx="10" fill="#161d27" stroke="#222b36"/><text x="16" y="34" font-size="14" font-weight="700" letter-spacing="0.06em" fill="#e6eaf0">ORCORE</text><text x="16" y="53" font-size="12" font-style="italic" fill="#f0b429">mission control</text><line x1="16" y1="66" x2="260" y2="66" stroke="#222b36"/><text x="16" y="86" font-size="13.5" font-weight="600" fill="#e6eaf0">The Passport Desk</text><text x="260" y="86" text-anchor="end" font-size="11" fill="#f0b429">Kepler-22b</text><text x="16" y="120" font-size="13.5" font-weight="600" fill="#e6eaf0">The Press</text><text x="260" y="120" text-anchor="end" font-size="11" fill="#f0b429">LHS 1140 b</text><text x="16" y="154" font-size="13.5" font-weight="600" fill="#e6eaf0">The Harvest</text><text x="260" y="154" text-anchor="end" font-size="11" fill="#f0b429">Kepler-452b</text><text x="16" y="180" font-size="11.5" fill="#7c8899">gives the finding an identity</text></g>
