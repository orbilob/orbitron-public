<svg xmlns="http://www.w3.org/2000/svg" width="880" height="158" viewBox="0 0 880 158" role="img" aria-label="The strategy engine — four stages: 1 lost in space, 2 found home, 3 back to school, 4 the proving ground.">
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}</style>
<rect width="880" height="158" rx="12" fill="#0d1117" stroke="#f0b42944"/>
<text x="28" y="52" font-size="27" font-weight="700" letter-spacing="0.11em" fill="#e6eaf0">THE STRATEGY ENGINE</text>
<text x="28" y="76" font-size="12.5" fill="#7c8899">the four stages between a bare signal and anything worth acting on</text>
<g transform="translate(28.0,96)"><rect width="195.5" height="42" rx="9" fill="#60a5fa1f" stroke="#60a5fa66"/><text x="15" y="27" font-size="15" font-weight="700" fill="#60a5fa">1</text><text x="34" y="26" font-size="13" font-weight="500" fill="#e6eaf0">lost in space</text></g><g transform="translate(237.5,96)"><rect width="195.5" height="42" rx="9" fill="#2ecc711f" stroke="#2ecc7166"/><text x="15" y="27" font-size="15" font-weight="700" fill="#2ecc71">2</text><text x="34" y="26" font-size="13" font-weight="500" fill="#e6eaf0">found home</text></g><g transform="translate(447.0,96)"><rect width="195.5" height="42" rx="9" fill="#f0b4291f" stroke="#f0b42966"/><text x="15" y="27" font-size="15" font-weight="700" fill="#f0b429">3</text><text x="34" y="26" font-size="13" font-weight="500" fill="#e6eaf0">back to school</text></g><g transform="translate(656.5,96)"><rect width="195.5" height="42" rx="9" fill="#a78bfa1f" stroke="#a78bfa66"/><text x="15" y="27" font-size="15" font-weight="700" fill="#a78bfa">4</text><text x="34" y="26" font-size="13" font-weight="500" fill="#e6eaf0">the proving ground</text></g>
</svg>
